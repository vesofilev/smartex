<!doctype html>
<html lang="en" data-theme="board">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smartex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* Blackboard (default): slate board, chalk ink. Paper: light working sheet. */
:root, [data-theme="board"] {
  --board: #1e2c29; --board-2: #22332f; --edge: #33473f; --chalk: #ebf0e8; --chalk-soft: #a7b7b0;
  --yellow: #f2d478; --blue: #9cc8e8; --pink: #f4a6b5; --green: #9be3a8; --red: #ff9a8b; --faded: #7c9188;
  --sel: #35503f; --gutter: #1a2724; --accent: var(--yellow); --accent-ink: #1e2c29;
  --sheet-shadow: 0 10px 30px rgba(0,0,0,.45);
}
[data-theme="paper"] {
  --board: #f3f5f7; --board-2: #ffffff; --edge: #cfd7df; --chalk: #13263a; --chalk-soft: #536679;
  --yellow: #9a6a00; --blue: #1f5fa8; --pink: #a8326b; --green: #1f7a4d; --red: #b3261e; --faded: #74859a;
  --sel: #d9e4f5; --gutter: #eef1f4; --accent: #2457a6; --accent-ink: #ffffff;
  --sheet-shadow: 0 6px 18px rgba(19,38,58,.14);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--chalk); font: 15px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  background-color: var(--board);
}
[data-theme="board"] body {
  /* faint chalk dust on the board */
  background-image:
    radial-gradient(circle at 18% 22%, rgba(235,240,232,.035) 0, transparent 38%),
    radial-gradient(circle at 82% 70%, rgba(235,240,232,.03) 0, transparent 42%),
    radial-gradient(circle at 50% 110%, rgba(156,200,232,.035) 0, transparent 50%);
}
button, select { font: inherit; color: inherit; }
button {
  border: 1px solid var(--edge); background: transparent; border-radius: 7px; padding: 5px 13px; cursor: pointer;
}
button:hover { border-color: var(--chalk-soft); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: .55; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: 12px "JetBrains Mono", monospace; opacity: .7; margin-left: 7px; }
#theme { display: inline-flex; align-items: center; gap: 8px; border-color: transparent; padding-left: 6px; }
#theme .track { width: 32px; height: 18px; border-radius: 9px; background: var(--edge); position: relative; transition: background .15s; }
#theme .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--chalk); transition: transform .15s; }
#theme[aria-checked="true"] .track { background: var(--accent); }
#theme[aria-checked="true"] .knob { transform: translateX(14px); background: var(--accent-ink); }
@media (prefers-reduced-motion: reduce) { #theme .track, #theme .knob { transition: none; } }

header { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--edge); }
.mark { font: 600 16px "JetBrains Mono", monospace; letter-spacing: .02em; display: flex; align-items: center; gap: 9px; }
.mark svg { width: 22px; height: 22px; }
header select { border: 1px solid var(--edge); background: var(--board-2); border-radius: 7px; padding: 4px 8px; }
#current { font: 14px "JetBrains Mono", monospace; color: var(--chalk-soft); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#current .dirty { color: var(--accent); }
#savestate { color: var(--chalk-soft); font-size: 14px; white-space: nowrap; }

main { display: grid; grid-template-columns: 220px minmax(260px, var(--split, 1fr)) 8px minmax(260px, 1fr); min-height: 0; }
aside { border-right: 1px solid var(--edge); overflow: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
aside h2 { font-size: 13px; font-weight: 700; color: var(--chalk-soft); margin: 10px 16px 4px; }
aside ul { list-style: none; margin: 0; padding: 0; }
aside li { padding: 4px 16px; cursor: pointer; font: 13.5px "JetBrains Mono", monospace; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; border-left: 3px solid transparent; color: var(--chalk-soft); }
aside li:hover { color: var(--chalk); background: var(--gutter); }
aside li.active { border-left-color: var(--accent); color: var(--chalk); background: var(--sel); }
aside li.dirty::after { content: " \25CF"; color: var(--accent); }
aside li.main-file { font-weight: 600; }
#outline li { font-family: "Atkinson Hyperlegible", sans-serif; font-size: 13.5px; }
#outline li.l2 { padding-left: 30px; } #outline li.l3 { padding-left: 44px; font-size: 13px; }
#outline .empty { color: var(--faded); cursor: default; font-size: 13px; }
aside .new { margin: 8px 16px; align-self: flex-start; font-size: 14px; }
#notes li { white-space: normal; font-family: "Atkinson Hyperlegible", sans-serif; font-size: 13.5px; line-height: 1.35;
  padding-top: 6px; padding-bottom: 6px; color: var(--chalk); }
#notes .where { display: block; font: 12px "JetBrains Mono", monospace; color: var(--pink); }
#notes .who { display: block; font-size: 12px; color: var(--faded); }
#notes button { font-size: 12px; padding: 1px 8px; margin-top: 4px; }
.CodeMirror-gutter.notes { width: 14px; }
.note-mark { color: var(--pink); cursor: pointer; font-size: 12px; line-height: 1; padding-left: 2px; }
.cm-note-line { background: rgba(244,166,181,.10); }

#editorpane { display: grid; grid-template-rows: auto 1fr auto auto; min-height: 0; min-width: 0; overflow: hidden; }
#banner { display: none; padding: 9px 16px; background: var(--sel); border-bottom: 1px solid var(--edge); font-size: 14px; }
#banner.show { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#banner span { flex: 1; min-width: 200px; }
#editor { min-height: 0; min-width: 0; overflow: hidden; position: relative; }
/* explicit rows: the hidden conflict banner must not shift the others up a row */
#banner { grid-row: 1; } #editor { grid-row: 2; } #issues { grid-row: 3; } #statusline { grid-row: 4; }
.CodeMirror { height: 100%; background: transparent; color: var(--chalk); font: 14.5px/1.65 "JetBrains Mono", ui-monospace, monospace; }
[data-theme="paper"] .CodeMirror { background: var(--board-2); }
.CodeMirror-gutters { background: var(--gutter); border-right: 1px solid var(--edge); }
.CodeMirror-linenumber { color: var(--faded); }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--sel); }
.CodeMirror-activeline-background { background: rgba(235,240,232,.04); }
[data-theme="paper"] .CodeMirror-activeline-background { background: #f5f8fb; }
.CodeMirror-matchingbracket { color: var(--chalk) !important; outline: 1px solid var(--pink); }
.cm-s-default .cm-tag { color: var(--yellow); }
.cm-s-default .cm-builtin, .cm-s-default .cm-keyword { color: var(--yellow); font-weight: 600; }
.cm-s-default .cm-atom { color: var(--pink); }
.cm-s-default .cm-number { color: var(--blue); }
.cm-s-default .cm-keyword.cm-math, .cm-s-default .cm-variable-2 { color: var(--blue); }
.cm-s-default .cm-comment { color: var(--faded); font-style: italic; }
.cm-s-default .cm-bracket { color: var(--pink); }
.cm-s-default .cm-error { color: var(--red); }
.CodeMirror-dialog { background: var(--board-2); color: var(--chalk); border-color: var(--edge) !important; }
.CodeMirror-dialog input { color: var(--chalk); font-family: "JetBrains Mono", monospace; }
.flash { background: rgba(242,212,120,.22); }

#issues { max-height: 30vh; overflow: auto; border-top: 1px solid var(--edge); font-size: 13.5px; display: none; }
#issues.show { display: block; }
#issues ul { margin: 0; padding: 0; }
#issues li { padding: 6px 16px; cursor: pointer; border-bottom: 1px solid var(--edge); list-style: none; }
#issues li:hover { background: var(--gutter); }
#issues .loc { font-family: "JetBrains Mono", monospace; margin-right: 9px; }
#issues .error .loc { color: var(--red); }
#issues .warning { color: var(--chalk-soft); }
#issues .warning .loc { color: var(--yellow); }
#statusline { display: flex; gap: 18px; padding: 4px 16px; font-size: 13px; color: var(--faded); border-top: 1px solid var(--edge); }

#splitter { cursor: col-resize; position: relative; }
#splitter::after { content: ""; position: absolute; inset: 0 3px; background: var(--edge); border-radius: 2px; }
#splitter:hover::after, #splitter.drag::after { background: var(--accent); }

#pdfpane { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; overflow: hidden; padding: 10px 16px 16px 8px; gap: 10px;
  background-color: var(--board); position: relative; z-index: 1; }
#tabs { display: flex; gap: 4px; }
#tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 4px 10px; color: var(--chalk-soft); }
#tabs button[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--accent); font-weight: 700; }
#agentdot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); margin-left: 6px; vertical-align: middle; }
#agentdot.show { display: inline-block; }
#paperview { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); gap: 10px; min-height: 0; min-width: 0; }
#agentview { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); gap: 10px; min-height: 0; min-width: 0; }
#chat li { overflow-wrap: anywhere; }
#paperview[hidden], #agentview[hidden] { display: none; }
#agentbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; color: var(--chalk-soft); }
#agentbar #agentstop { margin-left: auto; }
#agentbar #agentstate { flex: 1 1 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#agentbar select { font-size: 13px; padding: 2px 4px; border: 1px solid var(--edge); border-radius: 7px; background: var(--board-2); color: var(--chalk); }
#agentbar label { font-size: 12px; color: var(--faded); display: inline-flex; align-items: center; gap: 4px; }
#chat .katex { font-size: 1.06em; }
#chat .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 6px 0; }
#chat .user .katex-display { margin: 4px 0; }
#agentbar button { font-size: 13px; padding: 2px 10px; }
#agentstate.busy::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%;
  border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #agentstate.busy::before { animation: none; } }
#chat { list-style: none; margin: 0; padding: 0 4px 0 0; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
#chat .empty { color: var(--faded); font-size: 14px; line-height: 1.5; }
#chat .user { align-self: flex-end; max-width: 88%; background: var(--sel); border-radius: 10px 10px 2px 10px; padding: 7px 11px; white-space: pre-wrap; }
#chat .user .ctx { display: block; font: 11.5px "JetBrains Mono", monospace; color: var(--faded); margin-top: 3px; overflow-wrap: anywhere; }
#chat .assistant { max-width: 96%; line-height: 1.5; }
#chat .assistant p { margin: 0 0 7px; }
#chat .assistant code { font: 13px "JetBrains Mono", monospace; color: var(--yellow); }
#chat .assistant pre { font: 12.5px/1.5 "JetBrains Mono", monospace; background: var(--gutter); border: 1px solid var(--edge);
  border-radius: 6px; padding: 8px 10px; overflow: auto; margin: 0 0 7px; }
#chat .tool { font: 12.5px "JetBrains Mono", monospace; color: var(--faded); }
#chat .tool b { color: var(--blue); font-weight: 600; }
#chat .tool_error { font-size: 12.5px; color: var(--red); }
#chat .result { font-size: 12px; color: var(--faded); border-top: 1px dashed var(--edge); padding-top: 4px; }
#composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
#ask { resize: vertical; min-height: 44px; max-height: 30vh; background: var(--board-2); color: var(--chalk); border: 1px solid var(--edge);
  border-radius: 8px; padding: 8px 10px; font: 14.5px/1.45 "Atkinson Hyperlegible", sans-serif; }
#ask::placeholder { color: var(--faded); }
#strip { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-size: 14px; padding: 2px 2px 8px; position: relative; }
#strip::after { /* the chalk line */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px;
  background: var(--edge); opacity: .9;
}
#strip.ok::after { background: var(--green); }
#strip.err::after { background: var(--red); }
#strip.busy::after {
  background: linear-gradient(90deg, transparent 0, var(--accent) 30%, var(--accent) 70%, transparent 100%) 0 0 / 40% 100% no-repeat, var(--edge);
  animation: chalk 1.1s ease-in-out infinite;
}
@keyframes chalk { from { background-position: -40% 0, 0 0; } to { background-position: 140% 0, 0 0; } }
@media (prefers-reduced-motion: reduce) { #strip.busy::after { animation: none; background: var(--accent); } }
#strip .result { font-weight: 700; }
#strip.ok .result { color: var(--green); } #strip.err .result { color: var(--red); }
#strip #detail { color: var(--chalk-soft); }
#sheet { position: relative; min-height: 0; overflow: auto; padding: 2px 4px 24px; scroll-behavior: auto; }
#pages { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.page { position: relative; background: #fff; border-radius: 2px; box-shadow: var(--sheet-shadow); cursor: crosshair; max-width: none; }
.page img { display: block; width: 100%; height: 100%; }
.page .num { position: absolute; right: 8px; bottom: 6px; font: 11px "JetBrains Mono", monospace; color: #8796a5; }
.page .marker { position: absolute; left: -6px; right: -6px; height: 0; border-top: 3px solid var(--accent); opacity: 0;
  box-shadow: 0 0 0 5px rgba(242,212,120,.28); transition: opacity .35s; pointer-events: none; }
[data-theme="paper"] .page .marker { box-shadow: 0 0 0 5px rgba(36,87,166,.2); }
.page .marker.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .page .marker { transition: none; } }
#nopdf { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--chalk-soft); padding: 24px; gap: 6px; }
#nopdf strong { color: var(--chalk); font-size: 17px; }
#strip .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
#strip .tools button, #strip .tools a { font-size: 13px; padding: 2px 9px; color: var(--chalk-soft); border: 1px solid var(--edge); border-radius: 7px;
  text-decoration: none; background: transparent; cursor: pointer; }
#strip .tools button:hover, #strip .tools a:hover { color: var(--chalk); border-color: var(--chalk-soft); }
#zoomlevel { font: 12px "JetBrains Mono", monospace; color: var(--faded); min-width: 3.5em; text-align: center; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--chalk); color: var(--board);
  padding: 9px 15px; border-radius: 7px; font-size: 14px; display: none; max-width: 90vw; box-shadow: var(--sheet-shadow); }
#toast.show { display: block; }

@media (max-width: 960px) {
  html, body { height: auto; }
  body { display: block; overflow: auto; }
  main { grid-template-columns: 1fr; grid-template-rows: auto 70vh 85vh; }
  aside { border-right: 0; border-bottom: 1px solid var(--edge); max-height: 32vh; }
  #splitter { display: none; }
  #pdfpane { padding: 12px 16px; }
  header { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <span class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 12 12)"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>
    smartex
  </span>
  <select id="project" aria-label="Project"></select>
  <span id="current"></span>
  <span id="savestate"></span>
  <button id="theme" role="switch" aria-checked="true" title="Dark mode on or off">
    <span class="track" aria-hidden="true"><span class="knob"></span></span>Dark mode</button>
  <button id="save" title="Save the open file">Save<kbd>&#8984;S</kbd></button>
  <button id="compile" class="primary" title="Save all files and compile">Compile<kbd>&#8984;&#9166;</kbd></button>
</header>
<main id="main">
  <aside>
    <h2>Files</h2>
    <ul id="files" aria-label="Files"></ul>
    <button class="new" id="newfile">New file</button>
    <h2>Outline</h2>
    <ul id="outline" aria-label="Sections of the open file"></ul>
    <h2>Notes</h2>
    <ul id="notes" aria-label="Review notes"></ul>
  </aside>
  <section id="editorpane">
    <div id="banner" role="alert"><span id="bannertext"></span>
      <button id="reloaddisk">Load disk version</button><button id="keepmine">Keep mine and save</button></div>
    <div id="editor"></div>
    <div id="issues"><ul id="issuelist"></ul></div>
    <div id="statusline"><span id="pos"></span><span id="words"></span></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview" tabindex="0"></div>
  <section id="pdfpane">
    <div id="tabs" role="tablist">
      <button role="tab" id="tab-paper" aria-selected="true" aria-controls="paperview">Paper</button>
      <button role="tab" id="tab-agent" aria-selected="false" aria-controls="agentview">Assistant<span id="agentdot"></span></button>
    </div>
    <div id="paperview" role="tabpanel">
      <div id="strip"><span class="result" id="result">Not compiled yet</span><span id="detail"></span>
        <span class="tools">
          <button id="sync" title="Scroll the paper to the cursor's position in the source (Cmd/Ctrl J)">Find cursor</button>
          <button id="zoomout" title="Zoom out" aria-label="Zoom out">&minus;</button><span id="zoomlevel">100%</span>
          <button id="zoomin" title="Zoom in" aria-label="Zoom in">+</button>
          <a id="openpdf" target="_blank" rel="noopener" title="Open the PDF in your browser's own viewer, for searching and selecting text">Open PDF</a>
        </span></div>
      <div id="sheet" aria-label="Compiled paper; click a spot to jump to its source line"><div id="pages"></div>
        <div id="nopdf"><strong>No PDF yet</strong><span>Press Compile to typeset the paper.</span></div></div>
    </div>
    <div id="agentview" role="tabpanel" hidden>
      <div id="agentbar"><span id="agentstate">Asleep</span>
        <label>Model <select id="agentmodel" title="Model for the assistant (changing it resumes the same conversation)">
          <option value="">Default</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option>
          <option value="haiku">Haiku</option><option value="fable">Fable</option></select></label>
        <label>Effort <select id="agenteffort" title="How long the assistant thinks before answering">
          <option value="">Default</option><option value="low">Low</option><option value="medium">Medium</option>
          <option value="high">High</option><option value="xhigh">Extra high</option><option value="max">Max</option></select></label>
        <button id="agentstop" title="Stop the assistant process; the conversation is kept">Stop</button>
        <button id="agentnew" title="Forget this conversation and start a new one">New conversation</button></div>
      <ol id="chat" aria-live="polite"></ol>
      <form id="composer"><textarea id="ask" rows="2" aria-label="Message to the assistant"
        placeholder="Ask about the paper. The assistant sees which file and line you are on."></textarea>
        <button class="primary" type="submit">Send</button></form>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const CLIENT = 'human:browser-' + Math.random().toString(36).slice(2, 6);
const $ = id => document.getElementById(id);
const S = { project: null, main: null, files: [], docs: new Map(), current: null, conflict: null, compiling: false,
            notes: [], seq: null, noteMarks: [] };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'X-Token': token, 'X-Client': CLIENT, 'Content-Type': 'application/json' } });
  const isJson = (r.headers.get('content-type') || '').includes('json');
  const data = isJson ? await r.json() : null;
  if (!r.ok) { const e = new Error((data && data.error) || r.statusText); e.status = r.status; e.data = data; throw e; }
  return data;
}
const q = (extra = {}) => new URLSearchParams({ project: S.project, ...extra }).toString();
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }

/* theme */
/* dark mode = blackboard, light mode = paper; follows the system setting until you choose */
function setTheme(t, remember = true) {
  document.documentElement.dataset.theme = t; $('theme').setAttribute('aria-checked', String(t === 'board'));
  if (remember) store.set('smartex.theme', t);
}
const systemDark = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
setTheme(store.get('smartex.theme') || (systemDark() ? 'board' : 'paper'), false);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!store.get('smartex.theme')) setTheme(systemDark() ? 'board' : 'paper', false); });
setTimeout(() => showTab(store.get('smartex.tab') === 'agent' ? 'agent' : 'paper'), 0);
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'board' ? 'paper' : 'board');

/* editor */
const editor = CodeMirror($('editor'), {
  lineNumbers: true, lineWrapping: true, matchBrackets: true, styleActiveLine: true, indentUnit: 2,
  gutters: ['CodeMirror-linenumbers', 'notes'],
  extraKeys: { 'Cmd-S': () => save(), 'Ctrl-S': () => save(), 'Cmd-Enter': () => compile(), 'Ctrl-Enter': () => compile(), 'Alt-G': 'jumpToLine',
               'Cmd-J': () => { showTab('paper'); showCursorInPdf(); }, 'Ctrl-J': () => { showTab('paper'); showCursorInPdf(); } },
});
let outlineTimer;
editor.on('change', () => { renderState(); clearTimeout(outlineTimer); outlineTimer = setTimeout(renderOutline, 350); });
let presenceTimer;
editor.on('cursorActivity', () => {
  const c = editor.getCursor(); $('pos').textContent = `Line ${c.line + 1}, column ${c.ch + 1}`;
  clearTimeout(presenceTimer);
  presenceTimer = setTimeout(() => {
    if (!S.current) return;
    api('/api/presence?' + q(), { method: 'POST', body: JSON.stringify({ path: S.current, line: c.line + 1, ch: c.ch, selection: editor.getSelection() }) }).catch(() => {});
  }, 700);
});

const dirty = e => e && !e.doc.isClean(e.clean);
const anyDirty = () => [...S.docs.values()].some(dirty);

function renderState() {
  const e = S.docs.get(S.current);
  $('current').innerHTML = '';
  if (S.current) {
    const span = document.createElement('span'); span.textContent = S.current; $('current').append(span);
    if (dirty(e)) { const d = document.createElement('span'); d.className = 'dirty'; d.textContent = '  unsaved'; $('current').append(d); }
  }
  $('savestate').textContent = anyDirty() ? 'Unsaved changes' : (S.current ? 'All changes saved' : '');
  for (const li of $('files').children) {
    li.classList.toggle('active', li.dataset.path === S.current);
    li.classList.toggle('dirty', !!dirty(S.docs.get(li.dataset.path)));   // !! : toggle(name, undefined) would flip it
  }
  const text = editor.getValue().replace(/%.*$/gm, '').replace(/\\[a-zA-Z]+\*?/g, ' ').replace(/\$[^$]*\$/g, ' ');
  const n = (text.match(/[A-Za-zÀ-ɏ]+(?:['-][A-Za-z]+)*/g) || []).length;
  $('words').textContent = S.current ? `${n.toLocaleString()} words` : '';
}

function renderOutline() {
  const ul = $('outline'); ul.innerHTML = '';
  const re = /^\s*\\(section|subsection|subsubsection)\*?\s*\{([^}]*)\}/;
  let count = 0;
  editor.eachLine(h => {
    const m = h.text.match(re); if (!m) return;
    const li = document.createElement('li'); const lvl = { section: 1, subsection: 2, subsubsection: 3 }[m[1]];
    li.className = 'l' + lvl; li.textContent = m[2] || '(untitled)'; li.tabIndex = 0;
    const line = editor.getLineNumber(h);
    const go = () => { editor.setCursor({ line, ch: 0 }); editor.scrollIntoView({ line, ch: 0 }, 80); editor.focus(); };
    li.onclick = go; li.onkeydown = ev => { if (ev.key === 'Enter') go(); };
    ul.append(li); count++;
  });
  if (!count) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No sections in this file'; ul.append(li); }
}

/* projects and files */
async function loadProjects() {
  const projects = await api('/api/projects');
  const sel = $('project'); sel.innerHTML = '';
  for (const p of projects) { const o = document.createElement('option'); o.value = o.textContent = p.name; sel.append(o); }
  const saved = store.get('smartex.project');
  sel.value = projects.some(p => p.name === saved) ? saved : projects[0].name;
  await switchProject(sel.value);
}

async function switchProject(name) {
  if (anyDirty() && !confirm('Some files have unsaved changes. Switch project and discard them?')) { $('project').value = S.project; return; }
  S.project = name; S.docs.clear(); S.current = null; store.set('smartex.project', name);
  await refreshFiles();
  await refreshNotes();
  if (S.main) await openFile(S.main);
  showPdf(S.hasPdf);
  loadAgent();
  startEvents();
}

async function refreshFiles() {
  const r = await api('/api/files?' + q());
  S.files = r.files.map(f => typeof f === 'string' ? f : f.path); S.main = r.main; S.hasPdf = r.pdf;
  const ul = $('files'); ul.innerHTML = '';
  for (const f of S.files) {
    const li = document.createElement('li'); li.textContent = f; li.dataset.path = f; li.tabIndex = 0;
    if (f === S.main) { li.classList.add('main-file'); li.title = 'Main file, the one that gets compiled'; }
    li.onclick = () => openFile(f); li.onkeydown = ev => { if (ev.key === 'Enter') openFile(f); };
    ul.append(li);
  }
  renderState();
}

async function openFile(path, line) {
  if (!S.docs.has(path)) {
    const r = await api('/api/file?' + q({ path }));
    const tex = /\.(tex|cls|sty)$/.test(path);
    const doc = CodeMirror.Doc(r.content, tex ? 'stex' : 'text/plain');
    S.docs.set(path, { doc, sha: r.sha, clean: doc.changeGeneration() });
  }
  S.current = path; editor.swapDoc(S.docs.get(path).doc);
  if (line) {
    const l = Math.max(0, line - 1); editor.setCursor({ line: l, ch: 0 }); editor.scrollIntoView({ line: l, ch: 0 }, 120);
    const h = editor.addLineClass(l, 'background', 'flash'); setTimeout(() => editor.removeLineClass(h, 'background', 'flash'), 1500);
  }
  editor.focus(); renderState(); renderOutline(); renderNoteMarks();
  const c = editor.getCursor(); $('pos').textContent = `Line ${c.line + 1}, column ${c.ch + 1}`;
}

/* saving and conflicts */
async function save(path = S.current, force = false) {
  const e = S.docs.get(path); if (!e) return true;
  if (!dirty(e) && !force) return true;
  $('savestate').textContent = 'Saving';
  try {
    const content = e.doc.getValue(); const gen = e.doc.changeGeneration();
    const r = await api('/api/file?' + q({ path }), { method: 'POST', body: JSON.stringify({ content, base_sha: e.sha, force }) });
    e.sha = r.sha; e.clean = gen; renderState(); return true;
  } catch (err) {
    if (err.status === 409) { showConflict(path); return false; }
    toast('Could not save ' + path + ': ' + err.message, 5000); renderState(); return false;
  }
}
async function saveAll() { for (const p of S.docs.keys()) if (!(await save(p))) return false; return true; }
function showConflict(path) { S.conflict = path; $('bannertext').textContent = path + ' changed on disk while you were editing it.'; $('banner').classList.add('show'); }
function hideConflict() { S.conflict = null; $('banner').classList.remove('show'); }
$('reloaddisk').onclick = async () => { const p = S.conflict; hideConflict(); await reloadFromDisk(p); };
$('keepmine').onclick = async () => { const p = S.conflict; hideConflict(); if (await save(p, true)) toast('Saved your version of ' + p); };

async function reloadFromDisk(path) {
  const e = S.docs.get(path); if (!e) return;
  const r = await api('/api/file?' + q({ path }));
  const here = path === S.current; const cur = here ? editor.getCursor() : null; const sc = here ? editor.getScrollInfo() : null;
  e.doc.setValue(r.content); e.sha = r.sha; e.clean = e.doc.changeGeneration();
  if (here) { editor.setCursor(cur); editor.scrollTo(sc.left, sc.top); renderOutline(); }
  renderState();
}
async function poll() {
  if (!S.project || !S.docs.size || S.conflict) return;
  const params = new URLSearchParams({ project: S.project }); for (const p of S.docs.keys()) params.append('path', p);
  try {
    const shas = await api('/api/stat?' + params.toString());
    for (const [p, sha] of Object.entries(shas)) {
      const e = S.docs.get(p); if (!e || sha === null || sha === e.sha) continue;
      if (dirty(e)) { showConflict(p); break; } else { await reloadFromDisk(p); toast(p + ' was updated on disk and reloaded'); }
    }
  } catch (err) { /* server briefly unreachable; the next tick retries */ }
}
setInterval(poll, 4000);

/* compile and preview: server-rendered pages with forward (source -> PDF) and inverse (PDF -> source) search */
const P = { info: null, zoom: parseFloat(store.get('smartex.zoom')) || 1 };
async function loadPages() {
  let info;
  try { info = await api('/api/pdf/info?' + q({ main: S.main })); }
  catch (e) { P.info = null; $('pages').innerHTML = ''; $('nopdf').style.display = 'grid'; return false; }
  $('nopdf').style.display = 'none';
  const box = $('sheet'), prevTop = box.scrollTop, prevH = box.scrollHeight;
  const sizes = info.sizes && info.sizes.length ? info.sizes : Array.from({ length: info.pages }, () => [612, 792]);
  P.info = { ...info, sizes };
  const width = Math.max(200, box.clientWidth - 12) * P.zoom, dpr = window.devicePixelRatio || 1;
  const frag = document.createDocumentFragment();
  sizes.forEach(([w, h], i) => {
    const div = document.createElement('div'); div.className = 'page'; div.dataset.page = i + 1;
    div.style.width = `${Math.round(width)}px`; div.style.height = `${Math.round(width * h / w)}px`;
    const img = document.createElement('img'); img.alt = `Page ${i + 1}`; img.loading = 'lazy'; img.draggable = false;
    const dpi = Math.max(60, Math.min(240, Math.round(width * dpr * 72 / w)));
    img.src = '/api/pdf/page?' + q({ main: S.main, page: i + 1, dpi, token, v: info.mtime });
    const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
    const mk = document.createElement('div'); mk.className = 'marker';
    div.append(img, num, mk);
    div.addEventListener('click', ev => pdfToSource(ev, div, i + 1, w, h));
    frag.append(div);
  });
  $('pages').replaceChildren(frag);
  if (prevH > box.clientHeight) box.scrollTop = prevTop * (box.scrollHeight / prevH);   // keep the reader's place
  $('openpdf').href = '/api/pdf?' + q({ main: S.main, token, v: info.mtime });
  $('zoomlevel').textContent = `${Math.round(P.zoom * 100)}%`;
  return true;
}
async function showCursorInPdf(quiet) {
  if (!P.info || !S.current || !/\.tex$/.test(S.current)) { if (!quiet) toast('Open a .tex file of the document to find the cursor in the PDF'); return false; }
  const line = editor.getCursor().line + 1;
  let r;
  try { r = await api('/api/synctex/view?' + q({ path: S.current, line, main: S.main })); }
  catch (e) { if (!quiet) toast(e.status === 404 ? `${S.current} is not part of the compiled document` : 'Could not locate the cursor: ' + e.message); return false; }
  const div = $('pages').querySelector(`.page[data-page="${r.page}"]`); if (!div) return false;
  const [, h] = P.info.sizes[r.page - 1];
  const frac = Math.min(Math.max(r.y / h, 0), 1), box = $('sheet');
  box.scrollTop = Math.max(0, div.offsetTop + frac * div.offsetHeight - box.clientHeight * 0.3);
  const mk = div.querySelector('.marker'); mk.style.top = `${frac * 100}%`;
  mk.classList.add('show'); clearTimeout(mk._t); mk._t = setTimeout(() => mk.classList.remove('show'), 1800);
  return true;
}
async function pdfToSource(ev, div, page, w, h) {
  const rect = div.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * w, y = (ev.clientY - rect.top) / rect.height * h;
  try {
    const r = await api('/api/synctex/edit?' + q({ page, x: x.toFixed(1), y: y.toFixed(1), main: S.main }));
    if (S.files.includes(r.path)) await openFile(r.path, r.line); else toast(`That text comes from ${r.path}, line ${r.line}`);
  } catch (e) { toast('No source line found for that spot'); }
}
function setZoom(z) { P.zoom = Math.min(3, Math.max(0.5, Math.round(z * 10) / 10)); store.set('smartex.zoom', P.zoom); loadPages(); }
$('zoomin').onclick = () => setZoom(P.zoom + 0.1); $('zoomout').onclick = () => setZoom(P.zoom - 0.1);
$('sync').onclick = () => { if (A.tab !== 'paper') showTab('paper'); showCursorInPdf(); };
let resizeTimer; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(loadPages, 350); });
function showPdf(exists) { if (exists) loadPages(); else { $('pages').innerHTML = ''; $('nopdf').style.display = 'grid'; } }
async function compile() {
  if (S.compiling) return;
  if (!(await saveAll())) { toast('Resolve the file conflict before compiling', 4000); return; }
  S.compiling = true; $('compile').disabled = true;
  const strip = $('strip'); strip.className = 'busy'; $('result').textContent = 'Compiling'; $('detail').textContent = '';
  try {
    const r = await api('/api/compile?' + q(), { method: 'POST', body: JSON.stringify({ main: S.main }) });
    showCompile(r);
  } catch (err) {
    strip.className = 'err'; $('result').textContent = 'Compile request failed'; $('detail').textContent = err.message;
  } finally { S.compiling = false; $('compile').disabled = false; }
}
function showCompile(r, by) {
  const nE = r.errors.length, nW = r.warnings.length + (r.overfull || []).length;
  $('strip').className = r.ok ? 'ok' : 'err';
  $('result').textContent = r.ok ? 'Compiled' : (nE ? `Compile failed with ${nE} error${nE > 1 ? 's' : ''}` : 'Compile failed');
  $('detail').textContent = `in ${r.seconds} s` + (nW ? `, ${nW} warning${nW > 1 ? 's' : ''}` : '') + (by ? `, started by ${by}` : '');
  renderIssues(r);
  if (r.pdf) loadPages().then(ok => { if (ok && !by) showCursorInPdf(true); });   // an agent's compile keeps your place
}
function renderIssues(r) {
  const ul = $('issuelist'); ul.innerHTML = '';
  const add = (cls, loc, msg, file, line) => {
    const li = document.createElement('li'); li.className = cls; li.tabIndex = 0;
    const l = document.createElement('span'); l.className = 'loc'; l.textContent = loc; li.append(l, document.createTextNode(msg));
    const go = () => { if (file && S.files.includes(file)) openFile(file, line); else if (line) openFile(S.main, line); };
    li.onclick = go; li.onkeydown = ev => { if (ev.key === 'Enter') go(); };
    ul.append(li);
  };
  for (const e of r.errors) add('error', `${e.file}:${e.line}`, e.msg, e.file, e.line);
  for (const w of r.warnings) add('warning', w.line ? `line ${w.line}` : 'warning', w.msg, null, w.line);
  for (const o of (r.overfull || [])) add('warning', `line ${o.line}`, `Text sticks out of the column by ${o.points} pt`, null, o.line);
  $('issues').classList.toggle('show', ul.children.length > 0);
}

/* review notes */
async function refreshNotes() { S.notes = (await api('/api/notes?' + q())).notes; renderNotes(); renderNoteMarks(); }
function renderNotes() {
  const ul = $('notes'); ul.innerHTML = '';
  if (!S.notes.length) { const li = document.createElement('li'); li.className = 'empty'; li.style.color = 'var(--faded)';
    li.textContent = 'No open notes'; ul.append(li); return; }
  for (const n of S.notes) {
    const li = document.createElement('li'); li.tabIndex = 0;
    const w = document.createElement('span'); w.className = 'where'; w.textContent = `${n.path}:${n.line}`;
    const t = document.createElement('span'); t.textContent = n.text;
    const who = document.createElement('span'); who.className = 'who'; who.textContent = 'from ' + n.author;
    const b = document.createElement('button'); b.textContent = 'Resolve';
    b.onclick = async ev => { ev.stopPropagation(); await api('/api/notes/resolve?' + q(), { method: 'POST', body: JSON.stringify({ id: n.id }) }); await refreshNotes(); };
    li.append(w, t, who, b);
    li.onclick = () => openFile(n.path, n.line); li.onkeydown = ev => { if (ev.key === 'Enter') openFile(n.path, n.line); };
    ul.append(li);
  }
}
function renderNoteMarks() {
  editor.clearGutter('notes');
  for (const h of S.noteMarks) editor.removeLineClass(h, 'background', 'cm-note-line');
  S.noteMarks = [];
  for (const n of S.notes.filter(n => n.path === S.current)) {
    const l = Math.min(Math.max(0, n.line - 1), editor.lineCount() - 1);
    const m = document.createElement('span'); m.className = 'note-mark'; m.textContent = '\u25C6'; m.title = `${n.author}: ${n.text}`;
    m.onclick = () => toast(`${n.author}: ${n.text}`, 7000);
    editor.setGutterMarker(l, 'notes', m);
    S.noteMarks.push(editor.addLineClass(l, 'background', 'cm-note-line'));
  }
}

/* live event feed: changes made by agents and other people */
let eventsRunning = false;
async function startEvents() {
  if (eventsRunning) return; eventsRunning = true;
  try { S.seq = (await api('/api/events?' + q({ since: 0, timeout: 0 }))).last_seq; } catch (e) { S.seq = 0; }
  while (true) {
    try {
      const project = S.project;
      const r = await api('/api/events?' + q({ since: S.seq, timeout: 25 }));
      if (project !== S.project) continue;
      S.seq = r.last_seq;
      for (const ev of r.events) await handleEvent(ev);
    } catch (e) { await new Promise(res => setTimeout(res, 3000)); }
  }
}
async function handleEvent(ev) {
  const mine = ev.client === CLIENT;
  if (ev.type === 'file_written' && !mine) {
    const e = S.docs.get(ev.path);
    if (e && e.sha !== ev.sha) { if (dirty(e)) showConflict(ev.path); else { await reloadFromDisk(ev.path); toast(`${ev.path} was changed by ${ev.client}`); } }
  } else if (['file_created', 'file_renamed', 'file_deleted'].includes(ev.type)) {
    await refreshFiles(); if (!mine) toast(`${ev.client}: ${ev.type.replace('file_', '')} ${ev.path}${ev.to ? ' to ' + ev.to : ''}`);
  } else if (ev.type === 'compile_started' && !mine) {
    $('strip').className = 'busy'; $('result').textContent = 'Compiling'; $('detail').textContent = `started by ${ev.client}`;
  } else if (ev.type === 'compile_finished' && !mine) {
    try { showCompile(await api('/api/compile/last?' + q()), ev.client); } catch (e) {}
  } else if (ev.type === 'note_added' || ev.type === 'note_resolved') {
    await refreshNotes(); if (ev.type === 'note_added' && !mine) toast(`${ev.client} left a note on ${ev.path}:${ev.line}`);
  } else if (ev.type === 'agent_output') {
    await pullAgent();
  } else if (ev.type === 'agent_status') {
    A.status = ev.status; A.busy = ev.busy;
    if (ev.status === 'starting') A.model = null;          // a restart may bring a different model
    if (ev.status === 'ready' && !A.model) { try { A.model = (await api('/api/agent?' + q())).model; } catch (e) {} }
    renderAgentState();
  } else if (ev.type === 'ui_open' && !mine) {
    await openFile(ev.path, ev.line); toast(ev.message ? `${ev.client}: ${ev.message}` : `${ev.client} opened ${ev.path}:${ev.line}`, 7000);
  }
}

/* the assistant: a persistent Claude Code session on the server */
const A = { last: -1, status: 'stopped', busy: false, tab: 'paper' };
function showTab(t) {
  A.tab = t;
  $('tab-paper').setAttribute('aria-selected', t === 'paper'); $('tab-agent').setAttribute('aria-selected', t === 'agent');
  $('paperview').hidden = t !== 'paper'; $('agentview').hidden = t !== 'agent';
  if (t === 'agent') { $('agentdot').classList.remove('show'); $('ask').focus(); scrollChat(); }
  store.set('smartex.tab', t);
}
$('tab-paper').onclick = () => showTab('paper'); $('tab-agent').onclick = () => showTab('agent');
function scrollChat() { const c = $('chat'); c.scrollTop = c.scrollHeight; }
function esc(t) { return t.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
/* text with LaTeX math: $...$, $$...$$, \(...\), \[...\], equation/align environments; code stays verbatim */
function tex(src, display) {
  const clean = src.replace(/\\label\{[^}]*\}/g, '').replace(/\\(nonumber|notag)\b/g, '');
  if (!window.katex) return esc(display ? `\\[${src}\\]` : `$${src}$`);
  try { return katex.renderToString(clean, { displayMode: display, throwOnError: false, strict: 'ignore', trust: false, output: 'html' }); }
  catch (e) { return `<code>${esc(src)}</code>`; }
}
function richText(p) {
  const math = [], codes = [];
  const keep = (src, display) => { math.push(tex(src, display)); return `\u0000${math.length - 1}\u0000`; };
  p = p.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0001${codes.length - 1}\u0001`; })
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => keep(m, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => keep(m, true))
    .replace(/\\begin\{(equation|align|gather|multline|eqnarray)(\*?)\}([\s\S]+?)\\end\{\1\2\}/g,
             (_, env, star, body) => keep(/align|eqnarray/.test(env) ? `\\begin{aligned}${body}\\end{aligned}` : body, true))
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => keep(m, false))
    .replace(/(^|[^\\$])\$([^$\n]+?)\$/g, (_, pre, m) => pre + keep(m, false));
  return p.split(/\n{2,}/).filter(x => x.trim()).map(par => '<p>' + esc(par)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') + '</p>').join('')
    .replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${esc(codes[+i])}</code>`)
    .replace(/\u0000(\d+)\u0000/g, (_, i) => math[+i]);
}
function md(t) {
  return t.split(/```[a-zA-Z]*\n?/).map((p, i) => i % 2 ? `<pre>${esc(p.replace(/\n$/, ''))}</pre>` : richText(p)).join('');
}
function renderAgentState() {
  const el = $('agentstate');
  const label = { stopped: 'Asleep: your next message wakes it', starting: 'Waking up',
                  ready: A.model ? `Awake on ${A.model}` : 'Awake' }[A.status] || A.status;
  el.textContent = A.busy ? 'Working' : label; el.className = A.busy || A.status === 'starting' ? 'busy' : '';
  $('agentstop').disabled = A.status === 'stopped';
}
function addEntry(e) {
  const chat = $('chat'); const empty = chat.querySelector('.empty'); if (empty) empty.remove();
  const li = document.createElement('li'); li.className = e.role;
  if (e.role === 'user') { li.innerHTML = richText(e.text) || esc(e.text); if (e.context) { const c = document.createElement('span'); c.className = 'ctx'; c.textContent = e.context.split(';')[0]; li.append(c); } }
  else if (e.role === 'assistant') li.innerHTML = md(e.text);
  else if (e.role === 'tool') { const b = document.createElement('b'); b.textContent = e.name; li.append(b, document.createTextNode(' ' + Object.values(e.input || {}).join('  '))); }
  else if (e.role === 'tool_error') li.textContent = 'Tool error: ' + e.text;
  else if (e.role === 'result') li.textContent = e.ok ? `Done in ${e.seconds} s` : `Stopped (${e.subtype || 'error'}) after ${e.seconds} s`;
  chat.append(li);
}
async function loadAgent() {
  try {
    const info = await api('/api/agent?' + q()); A.status = info.status; A.busy = info.busy; A.model = info.model;
    $('agentmodel').value = info.model_requested || ''; $('agenteffort').value = info.effort || '';
    if (info.model_requested && $('agentmodel').value !== info.model_requested) {   // a full model name set through the API
      const o = document.createElement('option'); o.value = o.textContent = info.model_requested; $('agentmodel').append(o); $('agentmodel').value = info.model_requested; }
    $('chat').innerHTML = ''; A.last = -1;
    const t = await api('/api/agent/transcript?' + q({ since: -1 }));
    if (!t.entries.length) { const li = document.createElement('li'); li.className = 'empty';
      li.textContent = info.claude ? 'The assistant is a Claude Code session on the server. It keeps this conversation, sees what you are looking at, and makes its edits through smartex so you can watch and undo them.'
                                   : 'Claude Code is not installed on the server, so the assistant is unavailable.'; $('chat').append(li); }
    for (const e of t.entries) { addEntry(e); A.last = e.index; }
    renderAgentState(); scrollChat();
  } catch (e) { /* assistant endpoints unavailable */ }
}
async function pullAgent() {
  const t = await api('/api/agent/transcript?' + q({ since: A.last }));
  for (const e of t.entries) { addEntry(e); A.last = e.index; }
  A.status = t.status; A.busy = t.busy; renderAgentState(); scrollChat();
  if (A.tab !== 'agent' && t.entries.some(e => e.role === 'assistant')) $('agentdot').classList.add('show');
}
$('composer').onsubmit = async ev => {
  ev.preventDefault(); const text = $('ask').value.trim(); if (!text) return;
  $('ask').value = '';
  try { const info = await api('/api/agent/message?' + q(), { method: 'POST', body: JSON.stringify({ text }) }); A.status = info.status; A.busy = true; renderAgentState(); await pullAgent(); }
  catch (err) { toast('Could not reach the assistant: ' + err.message, 6000); $('ask').value = text; }
};
$('ask').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('composer').requestSubmit(); } });
async function configureAgent() {
  const body = { model: $('agentmodel').value, effort: $('agenteffort').value };
  try {
    const info = await api('/api/agent/config?' + q(), { method: 'POST', body: JSON.stringify(body) });
    A.status = info.status; A.model = info.model; renderAgentState();
    const m = $('agentmodel').selectedOptions[0].textContent, e = $('agenteffort').selectedOptions[0].textContent;
    toast(`The assistant will use ${m === 'Default' ? 'the default model' : m}${e === 'Default' ? '' : ', ' + e.toLowerCase() + ' effort'}` +
          (info.status !== 'stopped' ? '; it restarted and kept the conversation' : ''));
  } catch (err) {
    toast(err.message, 6000);
    try { const info = await api('/api/agent?' + q()); $('agentmodel').value = info.model_requested || ''; $('agenteffort').value = info.effort || ''; } catch (e) {}
  }
}
$('agentmodel').onchange = configureAgent; $('agenteffort').onchange = configureAgent;
$('agentstop').onclick = async () => { await api('/api/agent/stop?' + q(), { method: 'POST', body: '{}' }); A.status = 'stopped'; A.busy = false; renderAgentState(); };
$('agentnew').onclick = async () => { if (!confirm('Start a new conversation? The current one is archived.')) return;
  await api('/api/agent/reset?' + q(), { method: 'POST', body: '{}' }); await loadAgent(); };

/* resizable split between editor and preview */
(() => {
  const sp = $('splitter'), main = $('main');
  const apply = frac => { main.style.setProperty('--split', `${frac}fr`); store.set('smartex.split', frac); editor.refresh(); };
  const saved = parseFloat(store.get('smartex.split')); if (saved > 0) apply(saved);
  let drag = false;
  sp.addEventListener('pointerdown', ev => { drag = true; sp.classList.add('drag'); sp.setPointerCapture(ev.pointerId); });
  sp.addEventListener('pointermove', ev => {
    if (!drag) return;
    const rect = main.getBoundingClientRect(), side = 220, total = rect.width - side - 8;
    const left = Math.min(Math.max(ev.clientX - rect.left - side, 260), total - 260);
    apply(+(left / (total - left)).toFixed(3));
  });
  sp.addEventListener('pointerup', ev => { if (drag) loadPages(); drag = false; sp.classList.remove('drag'); });
  sp.addEventListener('keydown', ev => {
    const cur = parseFloat(getComputedStyle(main).getPropertyValue('--split')) || 1;
    if (ev.key === 'ArrowLeft') apply(Math.max(0.3, cur - 0.1)); if (ev.key === 'ArrowRight') apply(Math.min(3, cur + 0.1));
  });
})();

$('save').onclick = () => save();
$('compile').onclick = () => compile();
$('project').onchange = ev => switchProject(ev.target.value);
$('newfile').onclick = async () => {
  const name = prompt('Name of the new file, for example results.tex');
  if (!name) return;
  try { await api('/api/new?' + q({ path: name }), { method: 'POST', body: '{}' }); await refreshFiles(); await openFile(name); }
  catch (err) { toast('Could not create ' + name + ': ' + err.message, 5000); }
};
document.addEventListener('keydown', ev => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key === 's') { ev.preventDefault(); save(); }
  if (mod && ev.key === 'Enter') { ev.preventDefault(); compile(); }
  if (mod && (ev.key === 'j' || ev.key === 'J')) { ev.preventDefault(); if (A.tab !== 'paper') showTab('paper'); showCursorInPdf(); }
});
window.addEventListener('beforeunload', ev => { if (anyDirty()) { ev.preventDefault(); ev.returnValue = ''; } });

function fail(msg) { document.body.innerHTML = ''; const p = document.createElement('p'); p.style.padding = '28px'; p.textContent = msg; document.body.append(p); }
if (!token) fail('This address needs its access token. Open the full URL smartex printed when it started; it ends in ?token=...');
else loadProjects().catch(err => fail(err.status === 403
  ? 'The access token in this address is wrong. Open the URL smartex printed when it started.'
  : 'Could not reach smartex: ' + err.message));
</script>
</body>
